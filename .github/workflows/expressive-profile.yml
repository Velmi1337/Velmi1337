name: Expressive Profile
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json
      - .github/workflows/expressive-profile.yml
permissions:
  contents: write
concurrency:
  group: expressive-profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: metawka/expressive-profile@0dacdd6b4cd8d649b71ace733afbfe1b92649955
        with:
          token: ${{ github.token }}
          commit-message: 'Update Material 3 Expressive profile cards'
